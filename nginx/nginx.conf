# Single entry point in front of the API and both front-ends.
#
# Routing:
#   admin.<host>  -> admin-app  (staff panel)
#   <host>        -> user-app   (public site)
#   /api, /ws, /media, /static  -> the Django API, on either host
#
# For TLS, terminate at your load balancer or add a 443 server block with your
# certificate and redirect 80 -> 443.

upstream api_upstream      { server api:8000; }
upstream user_app_upstream { server user-app:3000; }
upstream admin_app_upstream { server admin-app:3001; }

# Rate limits: auth endpoints are the credential-stuffing target, so they get a
# much tighter bucket than ordinary API traffic.
limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name admin.* ;

    client_max_body_size 12m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The admin panel must never be indexed.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://api_upstream;
        include /etc/nginx/proxy_params.conf;
    }

    location /media/ { alias /var/www/media/; expires 7d; }
    location /static/ { alias /var/www/static/; expires 30d; }

    location / {
        proxy_pass http://admin_app_upstream;
        include /etc/nginx/proxy_params.conf;
    }
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 12m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Auth endpoints — tighter bucket than the rest of the API.
    location ~ ^/api/v1/auth/(login|admin-login|register|refresh)/ {
        limit_req zone=auth_zone burst=10 nodelay;
        proxy_pass http://api_upstream;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://api_upstream;
        include /etc/nginx/proxy_params.conf;
    }

    location /django-admin/ {
        proxy_pass http://api_upstream;
        include /etc/nginx/proxy_params.conf;
    }

    # Live price feed. The long read timeout keeps an idle socket from being
    # dropped between ticks.
    location /ws/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /media/  { alias /var/www/media/;  expires 7d;  access_log off; }
    location /static/ { alias /var/www/static/; expires 30d; access_log off; }

    location / {
        proxy_pass http://user_app_upstream;
        include /etc/nginx/proxy_params.conf;
    }
}
